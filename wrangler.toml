#:schema node_modules/wrangler/config-schema.json
name = "workers-firecrawl"
main = "src/index.ts"
compatibility_date = "2025-01-28"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = true

[observability]
enabled = true

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "DB"
database_name = "workers-firecrawl"
database_id = "637dfc08-e6e8-490f-ba9c-8c452168709f"

[[workflows]]
name = "workers-firecrawl-crawl"
binding = "CRAWL_WORKFLOW"
class_name = "CrawlWorkflow"
